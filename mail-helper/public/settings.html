<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱设置 · 外贸开发信小助手</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>邮箱设置</h1><nav><a href="/">客户首页</a><a href="/settings.html">邮箱设置</a></nav></header><main><p class="notice">密码只在此本机页面输入，不要发到聊天里。测试连接只验证登录，不会发测试邮件。</p>
<section><h2>快捷填写</h2><button id="gmail">填写 Gmail 常用服务器</button><p class="hint">Gmail 通常需要开启两步验证并创建应用专用密码；具体可用性以你的账号设置为准。</p></section>
<form id="settings"><section><h2>发信 SMTP</h2><div class="grid"><label>服务器<input name="smtpHost" autocomplete="off" placeholder="smtp.gmail.com"></label><label>端口<input name="smtpPort" type="number" min="1" max="65535" required></label><label class="check"><input name="smtpSecure" type="checkbox"> 安全连接 TLS</label></div></section>
<section><h2>收信 IMAP</h2><div class="grid"><label>服务器<input name="imapHost" autocomplete="off" placeholder="imap.gmail.com"></label><label>端口<input name="imapPort" type="number" min="1" max="65535" required></label><label class="check"><input name="imapSecure" type="checkbox"> 安全连接 TLS</label></div></section>
<section><h2>身份与签名</h2><div class="grid"><label>邮箱账号<input name="account" type="email" autocomplete="username" placeholder="yourname@gmail.com"></label><label>应用专用密码<input name="password" type="password" autocomplete="new-password" placeholder="留空则保留已保存密码"></label><label>发件人显示名<input name="senderName" placeholder="Sean"></label></div><label>签名<textarea name="signature" rows="5" placeholder="Sean&#10;MU Group"></textarea></label><p id="passwordState" class="hint"></p></section>
<div class="row"><button type="submit">保存设置</button><button type="button" id="testSmtp">测试 SMTP 连接</button><button type="button" id="testImap">测试 IMAP 连接</button></div><p id="result" role="status"></p></form></main><script src="/settings.js"></script></body></html>
